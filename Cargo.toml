[package]
name = "mcpg-plugin-backend-llm-openai"
version = "0.1.0-alpha.18"
license = "Apache-2.0"
edition = "2024"
description = """
OpenAI + Azure OpenAI backend plugins for MCPG. Ships two
`BackendPlugin` instances under one crate (the wire format is
identical; only URL pattern + auth header differ):

- `OpenAiChatPlugin` (`kind: "openai.chat"`)
- `AzureOpenaiChatPlugin` (`kind: "azure_openai.chat"`)

The shared adapter (`OpenAiAdapter`) is re-exported `pub` so the
sibling `mcpg-plugin-backend-llm-compat` crate can reuse it for
arbitrary OpenAI-compatible endpoints (vLLM, LocalAI, Together,
Groq, OpenRouter, Fireworks, …) without duplicating wire-format
code.

Future capability extensions (embedding, image, tts, stt) ship in
this same crate as additional `BackendPlugin` instances.
"""

[lib]
# cdylib: the .so the gateway's native_loader dlopens. rlib: keeps the
# in-tree unit/integration tests + the gateway's current static path
# (OpenAiChatPlugin::new + set_host_handle in app/mod.rs) building. The
# backend-plugin-migration adds the cdylib surface additively; the
# gateway stays on the static path for now.
crate-type = ["cdylib", "rlib"]

[features]
# Default OFF so the workspace build (which links the gateway bin
# against this crate as an rlib) does not emit `mcpg_plugin_register`
# and collide with the other plugin rlibs. Standalone cdylib builds
# (nx docker:build / OCI publish) opt in via `--features cdylib-export`.
default = []
cdylib-export = []
# Declared empty so the SDK macro's `register_static` accessor
# (`#[cfg(feature = "static-firstparty")]`) stays gated OFF here and
# does not trip `unexpected_cfgs`. The crate is consumed via the
# gateway's own manual registration block today, NOT through the SDK
# macro's static-firstparty path. (Note: the SDK *dependency* below
# still enables its own `static-firstparty` feature — that is a
# separate flag gating the SDK's `plugin_host` re-export, not this
# crate's `register_static` emission.)
static-firstparty = []

[dependencies]
tokio-util = "0.7"
mcpg-backend-llm-shared = { git = "https://github.com/mcpg-dev/mcpg-backend-llm-shared", tag = "v0.1.0-beta.16", version = "=0.1.0-beta.16" }
mcpg-sensitive = { git = "https://github.com/mcpg-dev/mcpg-sensitive", tag = "v0.1.0-beta.16", version = "=0.1.0-beta.16" }
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.16", version = "=0.1.0-beta.16" }
mcpg-plugin-sdk = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-beta.16", version = "=0.1.0-beta.16", features = ["static-firstparty"] }
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["clock"] }
futures = "0.3"
metrics = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `rt-multi-thread` powers the cdylib sync bridge's private runtime
# (`Builder::new_multi_thread`); the rest cover the async adapter logic
# shared with the static path.
tokio = { version = "1", features = [
  "sync",
  "rt",
  "rt-multi-thread",
  "time",
  "macros",
] }
tracing = "0.1"

[dev-dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
tokio-stream = "0.1"
tower = "0.5"
