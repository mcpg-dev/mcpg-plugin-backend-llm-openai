schema: mcpg.dev/plugin/v1
id: dev.mcpg.backend.llm.openai
name: OpenAI + Azure OpenAI Backends
license: Apache-2.0
description: |
  Cdylib descriptor for the OpenAI + Azure OpenAI backend plugins.
  Ships ten `backend` entities under one cdylib (chat, embedding,
  image, tts, stt — each with an OpenAI and an Azure variant). Each
  entity self-describes its real kind (`openai.chat`,
  `azure_openai.chat`, …) at runtime via its `manifest()` slot, so
  the host dispatches to the right binding.

  The static-firstparty path keeps using the per-kind `plugin.*.yaml`
  descriptors + the gateway's manual registration block; this single
  descriptor is for the native-cdylib loader only.
class: backend
runtime: native-cdylib-v1
protocol_version: "1.0"
required_capabilities: [network_outbound]
